<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wielka Powtórka</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 font-size=%2280%22><text y=%2280%22>%F0%9F%A7%AE</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#eef2ff; --bg2:#e0f2fe; --primary:#4f46e5; --primary-dark:#4338ca;
    --good:#16a34a; --bad:#dc2626; --text:#1e293b; --card-bg:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:'Quicksand','Trebuchet MS',-apple-system,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--text);padding:16px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{text-align:center;margin-bottom:20px;}
  h1{font-size:2rem;margin:0 0 4px;}
  .subtitle{margin:0;color:#475569;}
  .card{background:var(--card-bg);border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(79,70,229,0.12);text-align:center;}
  .primary-btn{background:var(--primary);color:#fff;border:none;border-radius:14px;padding:14px 28px;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:16px;font-family:inherit;transition:transform .15s, background .15s;}
  .primary-btn:hover{background:var(--primary-dark);transform:translateY(-2px);}
  .primary-btn:disabled{opacity:.5;cursor:default;transform:none;}
  .progress-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .progress-bar{flex:1;height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--primary);transition:width .3s;width:0;}
  #progress-text{font-size:.85rem;color:#64748b;white-space:nowrap;}
  .score-row{text-align:right;font-weight:700;color:var(--primary);margin-bottom:4px;}
  .topic-badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--primary);background:#eef2ff;border-radius:8px;padding:3px 12px;margin-bottom:10px;}
  .q-instruction{font-size:1.1rem;font-weight:700;margin:8px 0;}
  .word-phrase,.digital-time{font-size:1.6rem;font-weight:800;color:var(--primary);margin:6px 0 16px;}
  .time-range{font-size:1.2rem;margin:6px 0 16px;}
  .clock-big{margin:10px auto;}
  .clock-svg{width:100%;max-width:220px;height:auto;display:block;margin:0 auto;}
  .options{display:grid;gap:10px;margin-top:16px;grid-template-columns:repeat(2,1fr);}
  @media (max-width:420px){ .options-text{grid-template-columns:1fr;} }
  .opt-btn{border:2px solid #cbd5e1;background:#f8fafc;border-radius:14px;padding:12px;font-size:1.1rem;font-weight:700;cursor:pointer;font-family:inherit;color:var(--text);transition:all .15s;}
  .opt-btn:hover:not(:disabled){border-color:var(--primary);}
  .opt-btn:disabled{cursor:default;}
  .opt-btn.correct{border-color:var(--good);background:#dcfce7;color:#166534;}
  .opt-btn.wrong{border-color:var(--bad);background:#fee2e2;color:#991b1b;}
  .clock-option{padding:8px;}
  .clock-option svg{max-width:110px;}
  .input-row{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap;}
  #inputD{width:100px;padding:10px;font-size:1.2rem;border:2px solid #cbd5e1;border-radius:12px;text-align:center;font-family:inherit;}
  #inputD.correct{border-color:var(--good);background:#dcfce7;}
  #inputD.wrong{border-color:var(--bad);background:#fee2e2;}
  .check-btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:10px 20px;font-weight:700;cursor:pointer;font-family:inherit;}
  .check-btn:disabled{opacity:.6;cursor:default;}
  .feedback{min-height:28px;margin-top:14px;font-weight:700;font-size:1.05rem;}
  .feedback-good{color:var(--good);}
  .feedback-bad{color:var(--bad);}
  .hint-box{margin-top:10px;padding:10px 14px;background:#fef9c3;border:1px solid #fde68a;border-radius:12px;font-size:.92rem;font-weight:500;color:#78350f;text-align:left;line-height:1.4;}
  .hint-box strong{color:#78350f;}
  .correct-ring svg{outline:4px solid var(--good);border-radius:50%;}
  .wrong-ring svg{outline:4px solid var(--bad);border-radius:50%;}
  footer{text-align:center;margin-top:20px;color:#94a3b8;font-size:.85rem;}
  h2{margin-top:0;color:var(--primary);}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0;}
  .chip{border:2px solid #cbd5e1;background:#f8fafc;border-radius:999px;padding:9px 16px;font-weight:700;font-family:inherit;cursor:pointer;font-size:.92rem;color:var(--text);transition:all .15s;}
  .chip:hover{border-color:var(--primary);}
  .chip.selected{border-color:var(--primary);background:#eef2ff;color:var(--primary-dark);}
  .count-note{color:#64748b;font-size:.92rem;margin:10px 0 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧮 Wielka Powtórka</h1>
    <p class="subtitle">Dział: Zaczynamy przygodę z matematyką</p>
  </header>

  <section id="start-screen" class="card">
    <p>Wybierz zakres powtórki:</p>
    <div class="chip-row" id="topic-chips"></div>
    <p class="count-note" id="count-note"></p>
    <button id="start-btn" class="primary-btn">Rozpocznij quiz</button>
  </section>

  <section id="quiz-screen" class="card" hidden>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span id="progress-text"></span>
    </div>
    <div class="score-row">Wynik: <span id="score-text">0</span>/<span id="score-total">0</span></div>
    <div class="topic-badge" id="topic-badge"></div>
    <div id="question-area"></div>
    <div class="feedback" id="feedback"></div>
    <button id="next-btn" class="primary-btn" hidden>Dalej ▶</button>
  </section>

  <section id="result-screen" class="card" hidden>
    <h2 id="result-title"></h2>
    <p id="result-desc"></p>
    <button id="restart-btn" class="primary-btn">Zagraj ponownie</button>
  </section>

  <footer>
    <p>Powtórka z zegarów, kalendarza, cyfr rzymskich i długości — ćwiczenia do samodzielnej nauki.</p>
  </footer>
</div>

<script>
"use strict";

// ---------- generic utilities ----------
function pad2(n){ return String(n).padStart(2,'0'); }
function fmt(h,m){ return pad2(h)+':'+pad2(m); }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function choice(arr){ return arr[randInt(0,arr.length-1)]; }
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=randInt(0,i); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function sampleDistinct(pool, n, exclude){
  return shuffle(pool.filter(v=>v!==exclude)).slice(0,n);
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function uniquePush(arr, val){ if(!arr.includes(val)) arr.push(val); return arr; }

// ---------- shared option helpers ----------
function lockOptions(wrap){ [...wrap.children].forEach(b=>b.disabled=true); }
function markOption(btn,isCorrect){ btn.classList.add(isCorrect?'correct':'wrong'); }
function markCorrectByValue(wrap, correctText){
  const b=[...wrap.children].find(x=>x.dataset.correct==='true');
  if(b) b.classList.add('correct');
}
function renderTextOptions(container, wrapId, options, onAnswer){
  container.innerHTML += `<div class="options options-text" id="${wrapId}"></div>`;
  const wrap = container.querySelector('#'+wrapId);
  options.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='opt-btn'; btn.textContent=opt.text; btn.dataset.correct=opt.correct;
    btn.onclick=()=>{ lockOptions(wrap); markOption(btn,opt.correct); if(!opt.correct) markCorrectByValue(wrap); onAnswer(opt.correct); };
    wrap.appendChild(btn);
  });
}

/* =========================================================
   TOPIC 1: ZEGARY (clocks)
   ========================================================= */
const MINUTES = [0,5,10,15,20,25,30,35,40,45,50,55];
const NOM = [null,'pierwsza','druga','trzecia','czwarta','piąta','szósta','siódma','ósma','dziewiąta','dziesiąta','jedenasta','dwunasta'];
const GEN = [null,'pierwszej','drugiej','trzeciej','czwartej','piątej','szóstej','siódmej','ósmej','dziewiątej','dziesiątej','jedenastej','dwunastej'];
function h12(hour24){ const h = hour24 % 12; return h===0?12:h; }
function wordPhrase(hour24, minute){
  const cur = h12(hour24);
  const next = h12(hour24+1);
  switch(minute){
    case 0: return 'godzina ' + NOM[cur];
    case 5: return 'pięć po ' + GEN[cur];
    case 10: return 'dziesięć po ' + GEN[cur];
    case 15: return 'piętnaście po ' + GEN[cur];
    case 20: return 'dwadzieścia po ' + GEN[cur];
    case 25: return 'dwadzieścia pięć po ' + GEN[cur];
    case 30: return 'wpół do ' + GEN[next];
    case 35: return 'za dwadzieścia pięć ' + NOM[next];
    case 40: return 'za dwadzieścia ' + NOM[next];
    case 45: return 'za piętnaście ' + NOM[next];
    case 50: return 'za dziesięć ' + NOM[next];
    case 55: return 'za pięć ' + NOM[next];
  }
}
function polar(cx,cy,r,angleDeg){
  const rad = angleDeg*Math.PI/180;
  return { x: cx + r*Math.sin(rad), y: cy - r*Math.cos(rad) };
}
function clockFaceSVG({hour,minute,minuteHandMinute,size=170,id='',draggable=false}){
  const cx=size/2, cy=size/2, r=size/2-8;
  const mSource = (minuteHandMinute!==undefined ? minuteHandMinute : minute);
  const minuteAngle = mSource*6;
  const hourAngle = ((hour%12) + minute/60)*30;

  let ticks='';
  for(let i=0;i<60;i+=5){
    const big = i%15===0;
    const p1=polar(cx,cy,r-2,i*6);
    const p2=polar(cx,cy, big? r-14 : r-8, i*6);
    ticks+=`<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" stroke="#334155" stroke-width="${big?3:1.5}" stroke-linecap="round"/>`;
  }
  let numbers='';
  for(let n=1;n<=12;n++){
    const p = polar(cx,cy,r-26,n*30);
    numbers+=`<text x="${p.x.toFixed(1)}" y="${(p.y+5).toFixed(1)}" font-size="${(size*0.11).toFixed(1)}" text-anchor="middle" fill="#1e293b" font-weight="700">${n}</text>`;
  }
  const hourHandLen = r*0.5;
  const minuteHandLen = r*0.78;
  const hourHand = `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${(cy-hourHandLen).toFixed(1)}" stroke="#1e293b" stroke-width="6" stroke-linecap="round" transform="rotate(${hourAngle.toFixed(2)} ${cx} ${cy})"/>`;
  const minuteHand = `<g class="minhand-group" ${draggable?`style="cursor:grab;touch-action:none;"`:''} transform="rotate(${minuteAngle.toFixed(2)} ${cx} ${cy})">
     <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${(cy-minuteHandLen).toFixed(1)}" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
     ${draggable?`<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${(cy-minuteHandLen).toFixed(1)}" stroke="transparent" stroke-width="28" stroke-linecap="round"/>`:''}
  </g>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="clock-svg" data-id="${id}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#334155" stroke-width="4"/>
    ${ticks}
    ${numbers}
    ${hourHand}
    ${minuteHand}
    <circle cx="${cx}" cy="${cy}" r="7" fill="#1e293b"/>
  </svg>`;
}
function setupDraggableClock(container, size, state){
  const svg = container.querySelector('svg.clock-svg');
  const group = container.querySelector('.minhand-group');
  const cx=size/2, cy=size/2;
  let dragging=false;
  function angleFromEvent(e){
    const rect = svg.getBoundingClientRect();
    const clientCx = rect.left+rect.width/2;
    const clientCy = rect.top+rect.height/2;
    const dx = e.clientX-clientCx;
    const dy = e.clientY-clientCy;
    let ang = Math.atan2(dx,-dy)*180/Math.PI;
    if(ang<0) ang+=360;
    return ang;
  }
  function update(e){
    const ang = angleFromEvent(e);
    const idx = Math.round(ang/30)%12;
    group.setAttribute('transform', `rotate(${idx*30} ${cx} ${cy})`);
    state.minute = (idx*5)%60;
  }
  group.addEventListener('pointerdown', e=>{ e.preventDefault(); dragging=true; group.setPointerCapture(e.pointerId); update(e); });
  group.addEventListener('pointermove', e=>{ if(dragging) update(e); });
  group.addEventListener('pointerup', ()=>{ dragging=false; });
  group.addEventListener('pointercancel', ()=>{ dragging=false; });
}

function genTimeReadClock(){
  const hour=randInt(0,23), minute=choice(MINUTES);
  const wrong = sampleDistinct(MINUTES,3,minute);
  const options = shuffle([
    {text: fmt(hour,minute), correct:true},
    ...wrong.map(m=>({text: fmt(hour,m), correct:false}))
  ]);
  const hintMinute = minute===0
    ? `Wskazówka minutowa wskazuje 12 (czyli 0 minut) — to znaczy, że jest pełna godzina.`
    : `Wskazówka minutowa wskazuje ${minute} minut (licz co 5: każda kreska/cyfra na tarczy to 5 minut, ${minute}÷5=${minute/5} kresek).`;
  return {
    topicLabel:'Zegary', correctAnswerText: fmt(hour,minute),
    hint: `Wskazówka godzinowa (krótsza) jest tuż po ${h12(hour)} — czyli jest już po godzinie ${h12(hour)}. ${hintMinute}`,
    render(container,onAnswer){
      container.innerHTML = `
        <p class="q-instruction">Która to godzina?</p>
        <div class="clock-big">${clockFaceSVG({hour,minute,size:200,id:'qA'})}</div>`;
      renderTextOptions(container,'optsA',options,onAnswer);
    }
  };
}
function genTimePickClock(){
  const hour=randInt(0,23), minute=choice(MINUTES);
  const wrong = sampleDistinct(MINUTES,3,minute);
  const options = shuffle([
    {hour,minute,correct:true},
    ...wrong.map(m=>({hour,minute:m,correct:false}))
  ]);
  return {
    topicLabel:'Zegary', correctAnswerText: fmt(hour,minute),
    hint: `Szukaj zegara, na którym wskazówka godzinowa jest tuż po cyfrze ${h12(hour)}, a minutowa wskazuje ${minute===0?'12 (pełna godzina)':`${minute} minut, czyli cyfrę ${minute/5} na tarczy`}.`,
    render(container,onAnswer){
      container.innerHTML = `<p class="q-instruction">Który zegar pokazuje godzinę <strong>${fmt(hour,minute)}</strong>?</p>
      <div class="options options-clocks" id="optsB"></div>`;
      const wrap = container.querySelector('#optsB');
      options.forEach((opt,i)=>{
        const btn=document.createElement('button');
        btn.className='opt-btn clock-option'; btn.dataset.correct=opt.correct;
        btn.innerHTML = clockFaceSVG({hour:opt.hour,minute:opt.minute,size:120,id:'qB'+i});
        btn.onclick=()=>{ lockOptions(wrap); markOption(btn,opt.correct); if(!opt.correct) markCorrectByValue(wrap); onAnswer(opt.correct); };
        wrap.appendChild(btn);
      });
    }
  };
}
function timeWordHint(hour, minute){
  const cur = h12(hour), next = h12(hour+1);
  if(minute===0) return `„godzina ${NOM[cur]}” to pełna godzina — minuty to 00.`;
  if(minute<=25) return `„... po” oznacza tyle minut po pełnej godzinie, ile słyszysz w nazwie — czyli ${minute} minut po godzinie ${cur} (${GEN[cur]}).`;
  if(minute===30) return `„wpół do” oznacza dokładnie 30 minut po pełnej godzinie — czyli w połowie drogi do godziny ${next} (${GEN[next]}).`;
  return `„za ...” oznacza, ile minut brakuje do NASTĘPNEJ pełnej godziny. Tutaj brakuje ${60-minute} minut do godziny ${next} (bo 60-${minute}=${60-minute}), więc jest ${minute} minut po godzinie ${cur}.`;
}
function genTimeWords(){
  const hour=randInt(0,23), minute=choice(MINUTES);
  const direction = Math.random()<0.5 ? 1 : 2;
  const wrongMinutes = sampleDistinct(MINUTES,3,minute);
  let promptHTML, options, correctAnswerText;
  if(direction===1){
    promptHTML = `<p class="q-instruction">Jak zapiszesz cyfrowo godzinę:</p><p class="word-phrase">${wordPhrase(hour,minute)}</p>`;
    options = shuffle([{text:fmt(hour,minute),correct:true}, ...wrongMinutes.map(m=>({text:fmt(hour,m),correct:false}))]);
    correctAnswerText = fmt(hour,minute);
  } else {
    promptHTML = `<p class="q-instruction">Jak powiesz słownie godzinę:</p><p class="digital-time">${fmt(hour,minute)}</p>`;
    options = shuffle([{text:wordPhrase(hour,minute),correct:true}, ...wrongMinutes.map(m=>({text:wordPhrase(hour,m),correct:false}))]);
    correctAnswerText = wordPhrase(hour,minute);
  }
  return {
    topicLabel:'Zegary', correctAnswerText,
    hint: timeWordHint(hour,minute),
    render(container,onAnswer){
      container.innerHTML = promptHTML;
      renderTextOptions(container,'optsC',options,onAnswer);
    }
  };
}
function genTimeElapsed(){
  let start, end, elapsed;
  for(let tries=0; tries<30; tries++){
    const sh=randInt(0,22), sm=choice(MINUTES);
    const el=choice(MINUTES.filter(v=>v>0));
    let eh=sh, em=sm+el;
    if(em>=60){ eh+=1; em-=60; }
    if(eh<=23){ start={h:sh,m:sm}; end={h:eh,m:em}; elapsed=el; break; }
  }
  let elapsedHint;
  if(start.h===end.h){
    elapsedHint = `Godzina się nie zmieniła, więc wystarczy odjąć minuty: ${end.m} - ${start.m} = ${elapsed} min.`;
  } else {
    const toFullHour = 60-start.m;
    elapsedHint = `Podziel obliczenia na dwa etapy: od ${fmt(start.h,start.m)} do pełnej godziny ${fmt(start.h+1,0)} mija ${toFullHour} min, a od ${fmt(start.h+1,0)} do ${fmt(end.h,end.m)} mija ${end.m} min. Razem: ${toFullHour} + ${end.m} = ${elapsed} min.`;
  }
  return {
    topicLabel:'Zegary', correctAnswerText: elapsed+' min',
    hint: elapsedHint,
    render(container,onAnswer){
      container.innerHTML = `<p class="q-instruction">Oblicz, ile minut upłynęło:</p>
        <p class="time-range">od <strong>${fmt(start.h,start.m)}</strong> do <strong>${fmt(end.h,end.m)}</strong></p>
        <div class="input-row">
          <input type="number" inputmode="numeric" id="inputD" placeholder="minuty" autocomplete="off" />
          <button class="check-btn" id="checkD">Sprawdź</button>
        </div>`;
      const input = container.querySelector('#inputD');
      const btn = container.querySelector('#checkD');
      const submit=()=>{
        if(input.disabled) return;
        const val = parseInt(input.value,10);
        input.disabled=true; btn.disabled=true;
        const isCorrect = val===elapsed;
        input.classList.add(isCorrect?'correct':'wrong');
        onAnswer(isCorrect);
      };
      btn.onclick=submit;
      input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
      input.focus();
    }
  };
}
function genTimeSetHand(){
  const hour=randInt(0,23), minute=choice(MINUTES);
  const wrongStart = choice(MINUTES.filter(v=>v!==minute));
  const targetNumeral = minute===0?12:minute/5;
  return {
    topicLabel:'Zegary', correctAnswerText: fmt(hour,minute),
    hint: `Każda kreska/cyfra na tarczy to 5 minut. Aby ustawić ${minute} minut, przesuń wskazówkę tak, aby wskazywała cyfrę ${targetNumeral} (${minute===0?'czyli 12, na pełną godzinę':`bo ${targetNumeral}×5=${minute}`}).`,
    render(container,onAnswer){
      const size=200;
      container.innerHTML = `<p class="q-instruction">Ustaw niebieską wskazówkę minutową tak, aby zegar pokazywał:</p>
        <p class="digital-time">${fmt(hour,minute)}</p>
        <div class="clock-big" id="clockE">${clockFaceSVG({hour,minute,minuteHandMinute:wrongStart,size,id:'qE',draggable:true})}</div>
        <button class="check-btn" id="checkE">Sprawdź</button>`;
      const clockWrap = container.querySelector('#clockE');
      const state = { minute: wrongStart };
      setupDraggableClock(clockWrap, size, state);
      const checkBtn = container.querySelector('#checkE');
      checkBtn.onclick=()=>{
        if(checkBtn.disabled) return;
        const isCorrect = state.minute===minute;
        checkBtn.disabled=true;
        clockWrap.classList.add(isCorrect?'correct-ring':'wrong-ring');
        onAnswer(isCorrect);
      };
    }
  };
}

/* =========================================================
   TOPIC 2: KALENDARZ (calendar)
   ========================================================= */
const MONTHS = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const MONTHS_GEN = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const DAYS_NORMAL = [31,28,31,30,31,30,31,31,30,31,30,31];
const DAYS_LEAP    = [31,29,31,30,31,30,31,31,30,31,30,31];
const DOW = ['poniedziałek','wtorek','środa','czwartek','piątek','sobota','niedziela'];
const MONTH_ABBR = ['Sty','Lut','Mar','Kwi','Maj','Cze','Lip','Sie','Wrz','Paź','Lis','Gru'];
function isLeap(y){ return y%4===0; }
function weeksWord(n){ if(n===1) return 'tydzień'; if(n<=4) return 'tygodnie'; return 'tygodni'; }
function knuckleDiagramSVG(highlightIdx){
  const w=300, h=110, n=12, marginX=16;
  const stepX = (w-2*marginX)/(n-1);
  const highY=32, lowY=62;
  const pts = [];
  for(let i=0;i<n;i++){
    const isKnuckle = DAYS_NORMAL[i]===31;
    pts.push({x: marginX+i*stepX, y: isKnuckle?highY:lowY, isKnuckle});
  }
  const path = pts.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  let dots='', labels='';
  pts.forEach((p,i)=>{
    const isHi = i===highlightIdx;
    const r = isHi?9:5;
    const fill = isHi? '#4f46e5' : (p.isKnuckle?'#94a3b8':'#cbd5e1');
    dots+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="${fill}" stroke="${isHi?'#312e81':'none'}" stroke-width="2"/>`;
    const labelY = p.isKnuckle ? p.y-14 : p.y+20;
    labels+=`<text x="${p.x.toFixed(1)}" y="${labelY.toFixed(1)}" font-size="10" text-anchor="middle" fill="${isHi?'#4338ca':'#64748b'}" font-weight="${isHi?'800':'600'}">${MONTH_ABBR[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="max-width:320px;display:block;margin:8px auto 0;">
    <path d="${path}" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

/* =========================================================
   TOPIC 3: CYFRY RZYMSKIE (roman numerals)
   ========================================================= */
function toRoman(num){
  const table = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let res='';
  for(const [v,s] of table){
    while(num>=v){ res+=s; num-=v; }
  }
  return res;
}
const SUBTRACTIVE_RULE = `<br><small>Zasada: mniejsza cyfra przed większą — odejmujesz (np. IV=5-1=4). Mniejsza cyfra po większej — dodajesz (np. VI=5+1=6).</small>`;
function romanBreakdownHint(n, roman){
  const tens = Math.floor(n/10), ones = n%10;
  const needsRule = ones===4 || ones===9;
  if(tens===0){
    const onesText = ones===4?'IV = 5-1 = 4':ones===9?'IX = 10-1 = 9':`${'I'.repeat(ones)} czyli ${ones}×I`;
    return `${roman} to ${onesText} = ${n}.${needsRule?SUBTRACTIVE_RULE:''}`;
  }
  const tensRoman = 'X'.repeat(tens);
  if(ones===0) return `${roman} to ${tens}×X = ${n}.`;
  const onesRoman = toRoman(ones);
  const onesNote = ones===4?' (IV = 5-1 = 4)':ones===9?' (IX = 10-1 = 9)':'';
  return `Rozbij na dziesiątki i jedności: ${n} = ${tens*10} + ${ones}. ${tens*10} to ${tensRoman} (${tens}×X), a ${ones} to ${onesRoman}${onesNote}. Razem: ${tensRoman}+${onesRoman} = ${roman}.${needsRule?SUBTRACTIVE_RULE:''}`;
}
function genRomanToArabic(){
  const n = randInt(1,39);
  const roman = toRoman(n);
  const candidates = [n-1,n+1,n-5,n+5,n-10,n+10,n-2,n+2].filter(v=>v>=1 && v<=39 && v!==n);
  const distractors = shuffle([...new Set(candidates)]).slice(0,3);
  const options = shuffle([
    {text:String(n), correct:true},
    ...distractors.map(v=>({text:String(v), correct:false}))
  ]);
  return {
    topicLabel:'Cyfry rzymskie', correctAnswerText: String(n),
    hint: romanBreakdownHint(n, roman),
    render(container,onAnswer){
      container.innerHTML = `<p class="q-instruction">Jaką liczbą arabską jest:</p><p class="digital-time">${roman}</p>`;
      renderTextOptions(container,'optsRomA',options,onAnswer);
    }
  };
}
function genRomanToRoman(){
  const n = randInt(1,39);
  const correct = toRoman(n);
  const candidates = [n-1,n+1,n-5,n+5,n-10,n+10,n-2,n+2].filter(v=>v>=1 && v<=39 && v!==n);
  const distractorNums = shuffle([...new Set(candidates)]).slice(0,3);
  const options = shuffle([
    {text:correct, correct:true},
    ...distractorNums.map(v=>({text:toRoman(v), correct:false}))
  ]);
  return {
    topicLabel:'Cyfry rzymskie', correctAnswerText: correct,
    hint: romanBreakdownHint(n, correct),
    render(container,onAnswer){
      container.innerHTML = `<p class="q-instruction">Zapisz liczbę <strong>${n}</strong> cyframi rzymskimi.</p>`;
      renderTextOptions(container,'optsRomB',options,onAnswer);
    }
  };
}
function genRomanOperation(){
  const a = randInt(1,30), b = randInt(1, 39-a);
  const sum = a+b;
  const correct = toRoman(sum);
  const candidates = [sum-1,sum+1,sum-2,sum+2,sum-5,sum+5].filter(v=>v>=1 && v<=39 && v!==sum);
  const distractorNums = shuffle([...new Set(candidates)]).slice(0,3);
  const options = shuffle([
    {text:correct, correct:true},
    ...distractorNums.map(v=>({text:toRoman(v), correct:false}))
  ]);
  return {
    topicLabel:'Cyfry rzymskie', correctAnswerText: correct,
    hint: `Zamień na liczby arabskie: ${toRoman(a)} = ${a}, ${toRoman(b)} = ${b}. Dodaj: ${a} + ${b} = ${sum}. Zapisz wynik cyframi rzymskimi: ${sum} = ${correct}.`,
    render(container,onAnswer){
      container.innerHTML = `<p class="q-instruction">Oblicz i zapisz wynik cyframi rzymskimi:</p><p class="digital-time">${toRoman(a)} + ${toRoman(b)}</p>`;
      renderTextOptions(container,'optsRomC',options,onAnswer);
    }
  };
}

function genLenCompare(){
  const useKm = Math.random()<0.5;
  let aText, bText, aVal, bVal;
  if(!useKm){
    const aCm = randInt(50,250);
    let bM = randInt(1,3);
    while(bM*100===aCm) bM = randInt(1,3);
    aText = aCm+' cm'; bText = bM+' m';
    aVal = aCm; bVal = bM*100;

    while(bKm*1000===aM) bKm = randInt(1,3);
    aText = aM+' m'; bText = bKm+' km';

    {text:aText, correct:aText===correctText},

  ]);

const TIME_GENS = [genTimeReadClock, genTimePickClock, genTimeWords, genTimeElapsed, genTimeSetHand];
const CAL_GENS = [genCalMonthDays, genCalAdjacentMonth, genCalYearDays, genCalLeapCheck, genCalDayAfterWeeks, genCalDateAfterDays];
const ROMAN_GENS = [genRomanToArabic, genRomanToRoman, genRomanOperation];
const LEN_GENS = [genLenConvertFact, genLenChooseUnit, genLenCompare, genLenSplitForm];
const ALL_GENS = [...TIME_GENS, ...CAL_GENS, ...ROMAN_GENS, ...LEN_GENS];

const TOPIC_META = {
  all:      { label:'Wszystko (cały dział)', gens: ALL_GENS,   count: 20 },
  time:     { label:'Zegary',                gens: TIME_GENS,  count: 10 },
  calendar: { label:'Kalendarz',             gens: CAL_GENS,   count: 12 },
  roman:    { label:'Cyfry rzymskie',        gens: ROMAN_GENS, count: 9  },
  length:   { label:'Wzdłuż i wszerz',       gens: LEN_GENS,   count: 8  },
};
const TOPIC_ORDER = ['all','time','calendar','roman','length'];

function buildQuestionPool(topicKey){
  const meta = TOPIC_META[topicKey];
  let pool = [];
  while(pool.length < meta.count){
    pool = pool.concat(shuffle(meta.gens));
  }
  pool = pool.slice(0, meta.count);
  return shuffle(pool).map(g=>g());
}

/* =========================================================
   APP CONTROLLER
   ========================================================= */
const startScreen = document.getElementById('start-screen');
const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');
const questionArea = document.getElementById('question-area');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('next-btn');
const progressFill = document.getElementById('progress-fill');
const progressText = document.getElementById('progress-text');
const scoreText = document.getElementById('score-text');
const scoreTotal = document.getElementById('score-total');
const topicBadge = document.getElementById('topic-badge');
const resultTitle = document.getElementById('result-title');
const resultDesc = document.getElementById('result-desc');
const topicChipsWrap = document.getElementById('topic-chips');
const countNote = document.getElementById('count-note');

const PRAISE = ['Świetnie! ✅','Brawo! 🎉','Dokładnie tak! 👍','Super! ⭐','Tak jest! 🙌'];

const state = { questions:[], index:0, score:0, topic:'all' };

function renderTopicChips(){
  topicChipsWrap.innerHTML = '';
  TOPIC_ORDER.forEach(key=>{
    const btn = document.createElement('button');
    btn.className = 'chip' + (state.topic===key ? ' selected' : '');
    btn.textContent = TOPIC_META[key].label;
    btn.onclick = ()=>{ state.topic = key; renderTopicChips(); };
    topicChipsWrap.appendChild(btn);
  });
  countNote.textContent = `Czeka na Ciebie ${TOPIC_META[state.topic].count} pytań z zakresu: ${TOPIC_META[state.topic].label}.`;
}
renderTopicChips();

function startQuiz(){
  state.questions = buildQuestionPool(state.topic);
  state.index = 0;
  state.score = 0;
  startScreen.hidden = true;
  resultScreen.hidden = true;
  quizScreen.hidden = false;
  scoreTotal.textContent = state.questions.length;
  showQuestion();
}

function showQuestion(){
  const q = state.questions[state.index];
  progressFill.style.width = (state.index/state.questions.length*100)+'%';
  progressText.textContent = `Pytanie ${state.index+1} z ${state.questions.length}`;
  scoreText.textContent = state.score;
  topicBadge.textContent = q.topicLabel;
  feedback.textContent = '';
  feedback.className = 'feedback';
  nextBtn.hidden = true;
  questionArea.innerHTML = '';
  q.render(questionArea, (isCorrect)=>handleAnswer(isCorrect, q.correctAnswerText, q.hint));
}

function handleAnswer(isCorrect, correctAnswerText, hint){
  if(isCorrect){
    state.score++;
    scoreText.textContent = state.score;
    feedback.innerHTML = choice(PRAISE);
    feedback.className = 'feedback feedback-good';
  } else {
    const hintHTML = hint ? `<div class="hint-box">💡 <strong>Wskazówka:</strong> ${hint}</div>` : '';
    feedback.innerHTML = `Prawidłowa odpowiedź: ${correctAnswerText}${hintHTML}`;
    feedback.className = 'feedback feedback-bad';
  }
  nextBtn.hidden = false;
}

function goNext(){
  state.index++;
  if(state.index >= state.questions.length){
    showResults();
  } else {
    showQuestion();
  }
}

function showResults(){
  quizScreen.hidden = true;
  resultScreen.hidden = false;
  const total = state.questions.length;
  resultTitle.textContent = `Wynik: ${state.score} / ${total}`;
  let desc;
  if(state.score===total) desc='Perfekcyjnie! Znasz ten dział na wylot! 🏆';
  else if(state.score>=total*0.7) desc='Świetna robota! 👏';
  else if(state.score>=total*0.4) desc='Dobrze, jeszcze trochę ćwiczeń i będzie super! 💪';
  else desc='Ćwicz dalej — na pewno Ci pójdzie coraz lepiej! 📚';
  resultDesc.textContent = desc;
}

document.getElementById('start-btn').onclick = startQuiz;
document.getElementById('restart-btn').onclick = ()=>{
  startScreen.hidden = false;
  resultScreen.hidden = true;
  renderTopicChips();
};
nextBtn.onclick = goNext;
</script>
</body>
